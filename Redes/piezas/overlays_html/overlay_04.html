<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Outfit';
    src: url('../../assets/Outfit.ttf') format('truetype');
    font-weight: 700;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1920px;
    background: transparent;
    overflow: hidden;
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .card-container {
    position: absolute;
    left: 0;
    top: 410px;
    width: 530px;
    background: #C81E1E;
    padding: 60px 48px;
    border-radius: 0 28px 28px 0;
    box-shadow: 10px 10px 35px rgba(0, 0, 0, 0.45);
  }
  .card-text {
    color: #FFFFFF;
    font-size: 43px;
    font-weight: 700;
    line-height: 1.22;
    letter-spacing: -0.015em;
  }
</style>
</head>
<body>
  <div class="card-container">
    <div class="card-text">¿Sabías que hay clientes que amenazan con 1 estrella en Google Maps si no les regalas la cuenta?</div>
  </div>
</body>
</html>
