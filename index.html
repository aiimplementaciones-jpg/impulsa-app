<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IMPULSA - Gestión de Reputación Inteligente</title>
  
  <!-- Estilos del Proyecto -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Lucide Icons CDN para Iconografía Premium -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- QRCode.js CDN para generación HD de Códigos QR -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="app-container">
    
    <!-- BARRA LATERAL (Sidebar - Visible en Tabletas/Escritorios) -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">I</div>
        <span class="brand-name" data-i18n="brandName">IMPULSA</span>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" data-page="dashboard">
          <i data-lucide="layout-dashboard"></i>
          <span data-i18n="nav_dashboard">Dashboard</span>
        </button>
        <button class="nav-item" data-page="locations">
          <i data-lucide="map-pin"></i>
          <span data-i18n="nav_locations">Sucursales</span>
        </button>
        <button class="nav-item" data-page="statistics">
          <i data-lucide="bar-chart-3"></i>
          <span data-i18n="nav_statistics">Analítica</span>
        </button>
        <button class="nav-item" data-page="billing">
          <i data-lucide="credit-card"></i>
          <span data-i18n="nav_billing">Planes y Pagos</span>
        </button>
        <button class="nav-item" data-page="admin">
          <i data-lucide="shield-check"></i>
          <span data-i18n="nav_admin">Panel Admin</span>
        </button>
        <button class="nav-item" data-page="support">
          <i data-lucide="help-circle"></i>
          <span data-i18n="nav_support">Centro de Ayuda</span>
        </button>
      </nav>
      <div class="sidebar-footer">
        <p style="font-size: 0.75rem; color: var(--text-secondary); text-align: center;" data-i18n="slogan">
          Gestión de Reputación Inteligente
        </p>
      </div>
    </aside>

    <!-- CONTENEDOR DERECHO DE LA PÁGINA (Header + Main Content) -->
    <div style="flex: 1; display: flex; flex-direction: column; min-width: 0;">
      
      <!-- CABECERA PRINCIPAL (Header) -->
      <header class="app-header">
        <div class="brand-section">
          <!-- Logo en móviles (Oculto en Sidebar de escritorio) -->
          <div class="brand-logo" style="display: flex; @media (min-width: 768px) { display: none; }">I</div>
          <span class="brand-name" style="display: inline; @media (min-width: 768px) { display: none; }" data-i18n="brandName">IMPULSA</span>
        </div>
        
        <div class="header-actions">
          <!-- Selector de Idioma Dinámico -->
          <button class="header-btn" id="lang-btn" aria-label="Change Language">
            <i data-lucide="languages"></i>
          </button>
          
          <!-- Selector de Tema Claro/Oscuro -->
          <button class="header-btn" id="theme-btn" aria-label="Toggle Theme">
            <i data-lucide="sun" class="theme-icon-sun" style="display: none;"></i>
            <i data-lucide="moon" class="theme-icon-moon"></i>
          </button>
        </div>
      </header>

      <!-- CONTENEDOR DINÁMICO DE PÁGINAS -->
      <main class="main-content" id="app-view">
        <!-- Las vistas de las páginas se renderizarán dinámicamente aquí -->
        <div style="display: flex; justify-content: center; align-items: center; height: 50vh;">
          <div style="text-align: center; color: var(--text-secondary);">
            <div style="margin-bottom: 12px; font-weight: 600;" data-i18n="loading">Cargando IMPULSA...</div>
            <i data-lucide="loader" style="animation: spin 1.5s infinite linear; width: 32px; height: 32px; color: var(--color-brand);"></i>
          </div>
        </div>
      </main>

    </div>

    <!-- NAVEGACIÓN MÓVIL (Bottom Navigation Bar) -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-page="dashboard">
        <i data-lucide="layout-dashboard"></i>
        <span data-i18n="nav_dashboard">Dashboard</span>
      </button>
      <button class="nav-item" data-page="locations">
        <i data-lucide="map-pin"></i>
        <span data-i18n="nav_locations">Sucursales</span>
      </button>
      <button class="nav-item" data-page="statistics">
        <i data-lucide="bar-chart-3"></i>
        <span data-i18n="nav_statistics">Analítica</span>
      </button>
      <button class="nav-item" data-page="billing">
        <i data-lucide="credit-card"></i>
        <span data-i18n="nav_billing">Planes</span>
      </button>
      <button class="nav-item" data-page="admin">
        <i data-lucide="shield-check"></i>
        <span data-i18n="nav_admin">Admin</span>
      </button>
    </nav>

  </div>

  <!-- WIDGET FLOTANTE DE SOPORTE (ChatWidget) -->
  <div class="chat-widget-bubble" id="chat-bubble" aria-label="Open Chat Support">
    <i data-lucide="message-square"></i>
  </div>

  <!-- MODAL DEL CHAT DE SOPORTE (Bottom Sheet en Móviles) -->
  <div class="chat-widget-sheet" id="chat-sheet">
    <div class="chat-drawer">
      <div class="chat-drawer-header">
        <div class="chat-drawer-info">
          <div class="chat-drawer-avatar">IM</div>
          <div>
            <div class="chat-drawer-title" data-i18n="sup_chat_widget_title">Soporte IMPULSA</div>
            <div class="chat-drawer-status">online</div>
          </div>
        </div>
        <button class="header-btn" id="close-chat-btn" style="width: 32px; height: 32px;">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="chat-drawer-body" id="chat-messages-container">
        <!-- Mensajes del chat cargados dinámicamente -->
      </div>
      <div class="chat-drawer-footer">
        <input type="text" class="form-control" id="chat-input" data-i18n-placeholder="sup_chat_widget_input" placeholder="Escribe tu consulta..." style="font-size: 14px; padding: 10px 12px; height: 42px;">
        <button class="btn btn-primary" id="chat-send-btn" style="width: auto; padding: 0 16px; height: 42px; border-radius: var(--radius-md);">
          <i data-lucide="send" style="width: 18px; height: 18px;"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL DE CHECKOUT PASARELA DE PAGOS (Wompi & Bancolombia) -->
  <div class="checkout-modal" id="checkout-modal">
    <div class="checkout-sheet">
      <div class="checkout-header">
        <div class="checkout-brand">
          <span class="wompi-badge">Wompi</span>
          <span class="bancolombia-badge">Bancolombia</span>
        </div>
        <button class="header-btn" id="close-checkout-btn" style="width: 32px; height: 32px;">
          <i data-lucide="x"></i>
        </button>
      </div>
      <h3 style="margin-bottom: 4px;" data-i18n="bill_checkout_title">Pasarela de Pagos Segura</h3>
      <p style="font-size: 0.82rem; color: var(--text-secondary); margin-bottom: 20px;" data-i18n="bill_checkout_desc">Procesa tu pago de forma segura mediante Wompi y Bancolombia.</p>
      
      <div id="checkout-form-container">
        <div class="form-group">
          <label class="form-label" data-i18n="bill_card_number">Número de Tarjeta de Crédito</label>
          <input type="text" class="form-control" id="card-number" placeholder="4000 1234 5678 9010" maxlength="19">
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-group">
            <label class="form-label" data-i18n="bill_card_expiry">Fecha de Expiración</label>
            <input type="text" class="form-control" id="card-expiry" placeholder="MM/AA" maxlength="5">
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="bill_card_cvc">Código CVC</label>
            <input type="text" class="form-control" id="card-cvc" placeholder="123" maxlength="4">
          </div>
        </div>
        
        <button class="btn btn-primary" id="confirm-payment-btn" style="margin-top: 12px;">
          <i data-lucide="lock"></i>
          <span data-i18n="bill_pay_btn">Confirmar Pago</span>
        </button>
      </div>
      
      <div id="checkout-processing-container" style="display: none; text-align: center; padding: 32px 0;">
        <i data-lucide="loader" style="animation: spin 1.5s infinite linear; width: 48px; height: 48px; color: var(--color-brand); margin: 0 auto 16px auto;"></i>
        <p style="font-weight: 500;" data-i18n="bill_processing">Procesando pago de forma segura...</p>
      </div>
    </div>
  </div>

  <!-- CONTENEDOR DE CONFETI -->
  <div id="confetti-container" style="position: fixed; inset: 0; pointer-events: none; z-index: 9999;"></div>

  <!-- Spin keyframes en CSS auxiliar local -->
  <style>
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Lógica Principal de la Aplicación (Carga tradicional para evitar restricciones CORS en protocolo file://) -->
  <script src="translations.js"></script>
  <script src="app.js"></script>
</body>
</html>
